<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi Smart Hub</title>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>

<div class="hub">

  <header class="hub-header">
    <div class="clock">
      <span id="clock-h">--</span><span id="colon">:</span><span id="clock-m">--</span>
    </div>
    <div class="header-meta">
      <div id="date-display">Lädt...</div>
      <div class="location-line">Leipzig &thinsp;·&thinsp; Deutschland</div>
    </div>
  </header>

  <div class="hub-body">

    <section class="panel">
      <div class="panel-label">Outdoor</div>
      <div class="weather-temp-row">
        <span id="w-temp" class="weather-temp">--</span>
        <span class="weather-unit">°C</span>
      </div>
      <div id="w-desc" class="weather-desc">Wetter lädt...</div>
      <div class="weather-rows">
        <div class="weather-row">
          <span class="row-label">Gefühlt</span>
          <span id="w-feels" class="row-value">--</span>
        </div>
        <div class="weather-row">
          <span class="row-label">Luftfeuchtigkeit</span>
          <span id="w-hum" class="row-value">--</span>
        </div>
        <div class="weather-row">
          <span class="row-label">Wind</span>
          <span id="w-wind" class="row-value">--</span>
        </div>
      </div>
    </section>

    <div class="vdiv"></div>

    <section class="panel">
      <div class="panel-label">Indoor</div>
      <div class="sensors">
        <div>
          <div class="sensor-value">
            <span id="s-temp">--</span><span class="sensor-unit">°C</span>
          </div>
          <div class="sensor-label">Temperatur</div>
        </div>
        <div>
          <div class="sensor-value">
            <span id="s-hum">--</span><span class="sensor-unit">%</span>
          </div>
          <div class="sensor-label">Luftfeuchtigkeit</div>
        </div>
      </div>
    </section>

    <div class="vdiv"></div>

    <section class="panel">
      <div class="panel-label">Kalender</div>
      <div id="calendar-list"></div>
    </section>

  </div>

  <footer class="hub-footer">
    <div class="status-online">
      <span class="dot"></span>
      Pi Smart Hub &thinsp;·&thinsp; Online
    </div>
    <div id="last-update">--</div>
  </footer>

</div>

<script src="/static/js/clock.js"></script>
<script src="/static/js/calendar.js"></script>
<script src="/static/js/dashboard.js"></script>
</body>
</html>
